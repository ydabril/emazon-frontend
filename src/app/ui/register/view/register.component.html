<app-modal-message 
    *ngIf="showModalMessage" 
    [iconMessage]="modalIcon"
    [titleMessage]="modalTitle"
    [textMessage]="modalMessage"
    (closeModalValue)="closeModalMessage()"
    >
</app-modal-message>

<div class="container">
  <div class="login-card">
    <h2>Registro</h2>
    <div class="form-container">
      <app-form-user 
      (userRequestEvent)="saveUser($event)">
      </app-form-user>
    </div>
  </div>
</div>
