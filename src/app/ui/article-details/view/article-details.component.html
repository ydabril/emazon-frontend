<app-modal-message 
  *ngIf="showModalMessage" 
  [iconMessage]="modalIcon" 
  [titleMessage]="modalTitle"
  [textMessage]="modalMessage"
  [estimatedRestockDate]="estimatedRestockDate"
  (closeModalValue)="closeModalMessage()">
</app-modal-message>

<header></header>
<div class="product-container">
  <div class="product-image">
    <img src="/assets/images/article-placeholder2.jpeg" alt="Product Image">
  </div>
  <div class="product-info">
    <h2 class="product-title">{{ articleData?.name }}</h2>
    <div class="product-rating">
      <span class="stars">⭐⭐⭐⭐</span>
      <span class="rating-score">4.5/5</span>
    </div>
    <div class="product-pricing">
      <span class="current-price">${{ articleData?.price }}</span>
      <span class="original-price">${{ articleData!.price + 100}}</span>
      <span class="discount">-40%</span>
    </div>
    <p class="product-description">
      {{ articleData.description }}
    </p>
    <div class="product-options">
      <div class="color-options">
        <span>Marca</span>
        <p>{{ articleData?.brand?.name }}</p>
      </div>
      <div class="size-options">
        <span>Categorias</span>
        <div class="sizes">
          <button *ngFor="let category of articleData?.categories" class="size-btn">{{ category?.name }}</button>
        </div>
      </div>
    </div>

    <div class="product-quantity">
      <p>{{ articleData?.quantity }} </p>
      <span> en stock</span>
    </div>
    <div class="quantity-selector">
      <div class="quantity-selector_buttons">
        <button class="qty-btn" (click)="decreaseQuantity()">-</button>
        <span class="quantity">{{ quantity }}</span>
        <button class="qty-btn" (click)="increaseQuantity()">+</button>
      </div>
      <button class="add-to-cart-btn" (click)="addArticleCart()">Add to Cart</button>
    </div>
  </div>
</div>
