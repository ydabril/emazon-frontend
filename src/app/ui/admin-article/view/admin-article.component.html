<app-modal-article 
  *ngIf="openForm" 
  modalTitle="Registrar Artículo"
  [showForm]="openForm" 
  (closeFormValue)="closeFormArticle($event)">
  <div class="modal-form">
    <div class="modal-drag-drop">
      <drag-drop (imageSelected)="onImageSelected($event)"></drag-drop>
    </div>
    <div class="form-container">
      <app-form-article 
        [categoryList]="listDataCategory" 
        [brandList]="listDataBrand"
        (articleRequestEvent)="saveArticle($event)">
      </app-form-article>
    </div>
  </div>
</app-modal-article>

<app-modal-article 
    *ngIf="openFormSupply" 
    modalTitle="Agregar suministro al articulo"
    [showForm]="openFormSupply" 
    (closeFormValue)="closeFormSupply($event)">
    <div class="modal-form">
        <div class="form-container">
          <app-form-supply 
            (supplyRequestEvent)="addSupply($event)">
          </app-form-supply>
        </div>
      </div>
</app-modal-article>

<app-modal-message 
    *ngIf="showModalMessage" 
    [iconMessage]="modalIcon"
    [titleMessage]="modalTitle"
    [textMessage]="modalMessage"
    (closeModalValue)="closeModalMessage()"
    >
</app-modal-message>

<app-dashboard>
    <h2>Administrar <span>Articulos</span></h2>

    <div class="add-brand-button" *ngIf="userRole === 'ROLE_ADMIN'">
        <app-button ButtonIcon icon="add" (click)="openFormArticle()">Agregar Articulo</app-button>
    </div>

    <app-table 
        [columns]="articleColumns" 
        [tableData]="listDataArticle"
        (paginationChange)="getArticles($event)"
        (idEmitted)="assignArticleId($event)"
    ></app-table>

</app-dashboard>
